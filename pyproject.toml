[project]
name = "a13n-harness-ui-github-app"
version = "0.0.0"
description = "GitHub App Connector for a13n Harness UI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a13n-harness-ui>=0.37.6,<0.38",
    "anyio>=4,<5",
    "httpx2>=2.5,<3",
    "pydantic>=2.12,<3",
]

[project.entry-points."a13n_harness_ui.connectors"]
github-app = "a13n_harness_ui_github_app:GitHubApp"

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a13n_harness_ui_github_app"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
